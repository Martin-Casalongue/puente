
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puente</title>
    
    <!-- Carga de librerías necesarias desde internet -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Configuración de la cámara y de la escena AR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Lista de recursos (modelos o imágenes que usaremos) -->
      <a-assets>
        <a-asset-item id="miModelo3D" src="./Container.glb"></a-asset-item>
      </a-assets>

      <!-- Cámara virtual -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Cuando la cámara detecte el papel (targets.mind), mostrará lo que esté aquí dentro -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Colocamos el modelo 3D encima del objetivo -->
        <a-gltf-model 
          src="#miModelo3D" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0.5 0.5 0.5">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
